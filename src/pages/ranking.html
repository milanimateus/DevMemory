<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevMemory - Ranking</title>

    <!-- Importação dos estilos -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/ranking.css" />
  </head>
  <body>
    <!-- Navbar Fixa -->
    <nav class="navbar">
      <a href="home.html" class="nav-brand">
        <img
          src="../assets/DevMemory-Logo.png"
          alt="DevMemory Logo"
          class="nav-logo"
        />
      </a>
      <div class="nav-links">
        <a href="home.html" class="nav-item">Home</a>
        <a href="ranking.html" class="nav-item">Ranking</a>
        <a
          href="https://github.com/milanimateus"
          target="_blank"
          class="nav-item"
          >Contato</a
        >
      </div>
    </nav>

    <!-- Conteúdo Principal do Ranking -->
    <main class="ranking-container">
      <header class="ranking-header">
        <h1>Ranking de Jogadores</h1>
        <p>Confira os melhores tempos registrados em cada dificuldade.</p>
      </header>

      <!-- Filtros de Dificuldade -->
      <div class="ranking-filters">
        <!-- A classe 'active' inicia no Fácil por padrão -->
        <button type="button" class="btn-filter active" data-level="facil">
          Fácil
        </button>
        <button type="button" class="btn-filter" data-level="medio">
          Médio
        </button>
        <button type="button" class="btn-filter" data-level="dificil">
          Difícil
        </button>
        <button type="button" class="btn-filter" data-level="expert">
          Expert
        </button>
      </div>

      <!-- Quadro da Tabela -->
      <div class="ranking-board">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>Pos.</th>
              <th>Jogador</th>
              <th>Tempo</th>
            </tr>
          </thead>
          <tbody id="ranking-body">
            <!-- O JavaScript vai injetar as linhas (<tr>) aqui dentro -->
          </tbody>
        </table>

        <!-- Mensagem oculta para quando não houver dados no nível selecionado -->
        <p id="no-data-msg" class="no-data hidden">
          Nenhum recorde registrado nesta dificuldade ainda.
        </p>
      </div>

      <!-- Ações do Ranking -->
      <div class="ranking-actions">
        <button type="button" id="btn-clear-ranking" class="btn-clear-ranking">
          Limpar Ranking
        </button>
        <button type="button" id="btn-back" class="btn-back">
          Voltar ao Menu
        </button>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-bottom">
        <p>
          &copy; 2026 <strong>DevMemory</strong>. Desenvolvido para fins
          acadêmicos sob Licença MIT.
        </p>
      </div>
    </footer>

    <!-- Importação do script -->
    <script src="../js/ranking.js"></script>
  </body>
</html>
