<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Biblioteca de ícones/logos para as linguagens -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevMemory - Jogo</title>

    <!-- Reaproveitamos o global para o fundo escuro e fontes -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/game.css" />
  </head>
  <body>
    <!-- Navbar Fixa -->
    <nav class="navbar">
      <a href="home.html" class="nav-brand">
        <img
          src="../assets/DevMemory-Logo.png"
          alt="DevMemory Logo"
          class="nav-logo"
        />
      </a>
      <div class="nav-links">
        <a href="home.html" class="nav-item">Home</a>
        <a href="ranking.html" class="nav-item">Ranking</a>
        <a
          href="https://github.com/milanimateus"
          target="_blank"
          class="nav-item"
          >Contato( GitHub )</a
        >
      </div>
    </nav>
    <!-- Container que alinha a barra lateral e o tabuleiro lado a lado -->
    <div class="game-layout">
      <!-- Painel lateral esquerdo -->
      <aside class="game-sidebar">
        <h1>DevMemory</h1>

        <div class="stat-box">
          <span class="label">Jogador</span>
          <span id="player-name-display" class="value">---</span>
        </div>
        <div class="stat-box">
          <span class="label">Nível</span>
          <span id="level-display" class="value">---</span>
        </div>
        <div class="stat-box">
          <span class="label">Jogadas</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="stat-box">
          <span class="label">Tempo</span>
          <span id="timer" class="value">00:00</span>
        </div>
      </aside>

      <!-- Tabuleiro na direita -->
      <main class="game-container">
        <section class="grid" id="game-grid">
          <!-- As cartas serão injetadas dinamicamente via JavaScript aqui -->
        </section>
      </main>
    </div>
    <!-- Tela de Vitória (Inicia oculta via CSS) -->
    <div id="victory-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Desafio Concluído!</h2>
        <p>Excelente memória, <strong id="modal-player"></strong>!</p>
        <p>
          Você finalizou o nível <strong id="modal-level"></strong> em
          <strong id="modal-time"></strong>.
        </p>

        <div class="modal-buttons">
          <button id="btn-restart" class="btn-action">Jogar Novamente</button>
          <button id="btn-menu" class="btn-action secondary">
            Voltar ao Menu
          </button>
        </div>
      </div>
    </div>
    <footer class="footer">
      <div class="footer-bottom">
        <p>
          &copy; 2026 <strong>DevMemory</strong>. Desenvolvido para fins
          acadêmicos sob Licença MIT.
        </p>
      </div>
    </footer>
    <!-- Importação do script -->
    <script src="../js/game.js"></script>
  </body>
</html>
